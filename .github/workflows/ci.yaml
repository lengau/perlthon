name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check src/perlthon/ tests/
      - run: uv run ruff format --check src/perlthon/ tests/

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-rust]
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Install Perl dev headers
        run: sudo apt-get update && sudo apt-get install -y libperl-dev libcrypt-dev
      - run: uv run pytest -v

  wheel-linux-amd64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-amd64
          path: dist/*.whl

  wheel-linux-arm64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-arm64
          path: dist/*.whl

  wheel-linux-riscv64-rva20:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-riscv64-rva20
          path: dist/*.whl

  wheel-linux-riscv64-rva23:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64 -C target-feature=+v,+zba,+zbb,+zbs,+zicboz,+zicond,+zimop,+zfhmin,+zvfhmin"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-riscv64-rva23
          path: dist/*.whl
