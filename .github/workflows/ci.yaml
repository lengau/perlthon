name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run ruff check src/perlthon/ tests/
      - run: uv run ruff format --check src/perlthon/ tests/

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-rust]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v6
      - name: Install Perl dev headers
        run: sudo apt-get update && sudo apt-get install -y libperl-dev
      - run: uv run pytest -v
