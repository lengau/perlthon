name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - run: uvx ruff check src/perlthon/ tests/
      - run: uvx ruff format --check src/perlthon/ tests/

  lint-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy, rustfmt
      - name: Install Perl dev headers
        run: sudo apt-get update && sudo apt-get install -y libperl-dev libcrypt-dev
      - run: cargo clippy -- -D warnings
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    needs: [lint-python, lint-rust]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Install Perl dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y perl libperl-dev libcrypt-dev libcrypt1
          perl -e 'use POSIX; print "POSIX OK\n"'
      - run: uv run pytest -v -m 'not slow'

  wheel-linux-amd64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-amd64
          path: dist/*.whl

  wheel-linux-arm64:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-arm64
          path: dist/*.whl

  wheel-linux-riscv64-rva20:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-riscv64-rva20
          path: dist/*.whl

  wheel-linux-riscv64-rva23:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64 -C target-feature=+v,+zba,+zbb,+zbs,+zicboz,+zicond,+zimop,+zfhmin,+zvfhmin"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wheel-linux-riscv64-rva23
          path: dist/*.whl
