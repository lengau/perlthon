name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel-linux-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-amd64
          path: dist/*.whl

  wheel-linux-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-arm64
          path: dist/*.whl

  wheel-linux-riscv64-rva20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-riscv64-rva20
          path: dist/*.whl

  wheel-linux-riscv64-rva23:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use upstream crates (not vendored)
        run: rm -f .cargo/config.toml
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            rm -f .cargo/config.toml
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64 -C target-feature=+v,+zba,+zbb,+zbs,+zicboz,+zicond,+zimop,+zfhmin,+zvfhmin"
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-riscv64-rva23
          path: dist/*.whl

  release:
    needs:
      - sdist
      - wheel-linux-amd64
      - wheel-linux-arm64
      - wheel-linux-riscv64-rva20
      - wheel-linux-riscv64-rva23
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
