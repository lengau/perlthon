name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify commit signature
        run: |
          TAG_COMMIT=$(git rev-list -n 1 "${{ github.ref_name }}")
          if ! git verify-commit "$TAG_COMMIT" 2>/dev/null; then
            echo "::error::Release commit is not signed"
            exit 1
          fi

  sdist:
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  wheel-linux-amd64:
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Perl dev headers
        run: sudo apt-get update && sudo apt-get install -y libperl-dev libcrypt-dev
      - uses: PyO3/maturin-action@v1
        with:
          target: x86_64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-amd64
          path: dist/*.whl

  wheel-linux-arm64:
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: PyO3/maturin-action@v1
        with:
          target: aarch64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-arm64
          path: dist/*.whl

  wheel-linux-riscv64-rva20:
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64"
      - name: Rename wheel to indicate RVA20 profile
        run: |
          for f in dist/*.whl; do
            mv "$f" "${f/linux_riscv64/linux_riscv64_rva20}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-riscv64-rva20
          path: dist/*.whl

  wheel-linux-riscv64-rva23:
    needs: verify-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: riscv64
      - uses: PyO3/maturin-action@v1
        with:
          target: riscv64gc-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist
          before-script-linux: |
            apt-get update && apt-get install -y libperl-dev libcrypt-dev
        env:
          RUSTFLAGS: "-C target-cpu=generic-rv64 -C target-feature=+v,+zba,+zbb,+zbs,+zicboz,+zicond,+zimop,+zfhmin,+zvfhmin"
      - name: Rename wheel to indicate RVA23 profile
        run: |
          for f in dist/*.whl; do
            mv "$f" "${f/linux_riscv64/linux_riscv64_rva23}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-linux-riscv64-rva23
          path: dist/*.whl

  release:
    needs:
      - sdist
      - wheel-linux-amd64
      - wheel-linux-arm64
      - wheel-linux-riscv64-rva20
      - wheel-linux-riscv64-rva23
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
