[project]
name = "perlthon"
version = "0.1.0"
description = "Natively import and run Perl modules from Python"
readme = "README.md"
authors = [
    { name = "Alex M. Lowe", email = "alex.lowe@canonical.com" }
]
requires-python = ">=3.12"
dependencies = []

[tool.maturin]
module-name = "perlthon._core"
python-packages = ["perlthon"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
