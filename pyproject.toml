[project]
name = "perlthon"
version = "0.1.1.1"
description = "Natively import and run Perl modules from Python"
readme = "README.md"
authors = [
    { name = "Alex M. Lowe", email = "alex.lowe@canonical.com" }
]
requires-python = ">=3.12"
license = {file = "LICENSE"}
classifiers = [
    "License :: Other/Proprietary License",
]
dependencies = []

[tool.maturin]
module-name = "perlthon._core"
python-packages = ["perlthon"]
python-source = "src"

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.rs" }, { file = "Cargo.toml" }, { file = "Cargo.lock" }]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
]
docs = [
    "canonical-sphinx>=0.6.0",
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc2>=0.5.0",
    "sphinx-copybutton>=0.5.2",
    "sphinxext-opengraph>=0.9.1",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "slow: tests that download modules from CPAN",
]
